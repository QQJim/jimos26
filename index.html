<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jimOS v3.0 - Ultimate</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="light-theme">
    
    <!-- Boot Screen -->
    <div id="boot-screen">
        <div class="apple-logo"><i class="fab fa-apple"></i></div>
        <div class="progress-bar-container"><div class="progress-bar"></div></div>
        <div class="boot-text">Welcome to jimOS v3.0 Ultimate</div>
    </div>

    <!-- Setup Assistant -->
    <div id="setup-assistant" class="hidden">
        <div class="setup-window glass">
            <h2 id="setup-title">Welcome to jimOS</h2>
            <div class="step active">
                <label id="lang-label">語言 / Language</label>
                <div class="options">
                    <button class="btn active" data-lang="zh-TW">繁體中文</button>
                    <button class="btn" data-lang="en-US">English</button>
                    <button class="btn" data-lang="ja-JP">日本語</button>
                </div>
            </div>
            <div class="step">
                <label id="name-label">您的名字 / Your Name</label>
                <input type="text" id="setup-username" value="Jim">
            </div>
            <button class="primary-btn" id="setup-finish">開始使用 jimOS</button>
        </div>
    </div>

    <!-- Desktop -->
    <div id="desktop" class="hidden">
        <!-- Wallpaper -->
        <div id="wallpaper"></div>

        <!-- Menu Bar -->
        <div id="menubar" class="glass-bar">
            <div class="left-menu">
                <span class="apple-icon" onclick="os.showAppleMenu()"><i class="fab fa-apple"></i></span>
                <span id="active-app-name" class="bold">jimOS</span>
                <span class="menu-item" onclick="os.lockScreen()">鎖定</span>
                <span class="menu-item" onclick="apps.open('settings')">系統設定</span>
            </div>
            <div class="right-menu">
                <span class="status-icon"><i class="fas fa-wifi"></i></span>
                <span class="status-icon"><i class="fas fa-battery-three-quarters"></i> 86%</span>
                <span class="status-icon" onclick="toggleNotificationCenter()"><i class="fas fa-bell"></i></span>
                <span id="clock">10:53 AM</span>
                <span class="status-icon" onclick="os.toggleTheme()" title="深色模式"><i class="fas fa-moon"></i></span>
            </div>
        </div>

        <!-- Desktop Icons -->
        <div id="desktop-icons" ondrop="drop(event)" ondragover="allowDrop(event)"></div>

        <!-- Widgets (桌面小工具) -->
        <div id="widgets" class="hidden"></div>

        <!-- Window Area -->
        <div id="window-area"></div>

        <!-- Notification Center -->
        <div id="notification-center" class="glass hidden"></div>

        <!-- Dock -->
        <div id="dock-container">
            <div class="dock glass">
                <!-- 9個核心App + 分隔線 + Trash -->
                <div class="dock-item" data-app="finder" title="Finder"><div class="icon finder-icon"><i class="fas fa-folder-open"></i></div><div class="dot"></div></div>
                <div class="dock-item" data-app="safari" title="Safari"><div class="icon safari-icon"><i class="fas fa-globe"></i></div><div class="dot"></div></div>
                <div class="dock-item" data-app="terminal" title="Terminal"><div class="icon terminal-icon"><i class="fas fa-terminal"></i></div><div class="dot"></div></div>
                <div class="dock-item" data-app="notes" title="Notes"><div class="icon notes-icon"><i class="fas fa-sticky-note"></i></div><div class="dot"></div></div>
                <div class="dock-item" data-app="photos" title="Photos"><div class="icon photos-icon"><i class="fas fa-images"></i></div><div class="dot"></div></div>
                <div class="dock-item" data-app="music" title="Music"><div class="icon music-icon"><i class="fas fa-music"></i></div><div class="dot"></div></div>
                <div class="dock-item" data-app="calculator" title="Calculator"><div class="icon calc-icon"><i class="fas fa-calculator"></i></div><div class="dot"></div></div>
                <div class="dock-item" data-app="calendar" title="Calendar"><div class="icon calendar-icon"><i class="fas fa-calendar-alt"></i></div><div class="dot"></div></div>
                <div class="dock-item" data-app="settings" title="Settings"><div class="icon settings-icon"><i class="fas fa-cog"></i></div><div class="dot"></div></div>
                <div class="separator"></div>
                <div class="dock-item" data-app="trash" title="Trash"><div class="icon trash-icon"><i class="fas fa-trash"></i></div></div>
            </div>
        </div>
    </div>

    <!-- Context Menu -->
    <div id="context-menu" class="glass hidden"></div>

    <!-- Apple Menu -->
    <div id="apple-menu" class="glass hidden"></div>

    <script src="script.js"></script>
</body>
</html>
